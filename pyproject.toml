[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subactor-procache"
version = "0.1.0"
description = "Process-safe TTL caching and request coalescing for provider read APIs."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.wellmanifest]
standard = "0.20.35"
revision = "cfaa0bf0ea6b0e7349fed0bb62b5ce15792d687d"
gate = "project/governance-check.sh"
